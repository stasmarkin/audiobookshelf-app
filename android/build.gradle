// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext.kotlin_version = '2.0.0'

  repositories {
        google()
        mavenCentral()
    }
    dependencies {
      classpath 'com.google.gms:google-services:4.4.2'
      classpath 'com.android.tools.build:gradle:8.9.1'
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
      // KSP must match the Kotlin Gradle Plugin; the Room plugin must match room_version in variables.gradle
      classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.0-1.0.24"
      classpath "androidx.room:room-gradle-plugin:2.7.2"

      // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
  delete rootProject.layout.buildDirectory
}

