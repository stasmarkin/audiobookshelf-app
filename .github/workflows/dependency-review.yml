name: Dependency review

on:
  pull_request:
    branches: [plus]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub-maintained action; reviewed and pinned to the v4 commit.
      # Uses the dependency comparison API; no checkout or PR code execution.
      - name: Check newly introduced dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false