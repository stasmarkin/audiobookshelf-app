# Android validation: JS tests, web build, debug build and Kotlin JVM/Robolectric tests.
# Runs on pull requests (not on pushes, so a merge is not validated a second time) and on demand
# (workflow_dispatch: pick the branch or tag, e.g. before a release). Newer pushes to the same pull request cancel the
# superseded run. It builds and tests only; it never touches signing. An installable debug APK comes from "Debug Test
# APK (development only)" on demand (docs/debug-test-builds.md). Distributable APKs are built and signed as described in
# docs/release-process.md.
name: Build APK

on:
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push cancels the superseded run. On-demand runs are never cancelled by another run.
concurrency:
  group: build-apk-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      # Glob form on purpose: `node --test tests/` fails on Node 22+
      - name: run JS tests
        run: node --test tests/*.test.mjs

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: run Kotlin unit tests (JVM + Robolectric)
        run: ./android/gradlew testDebugUnitTest -p android --no-daemon

      - name: upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
