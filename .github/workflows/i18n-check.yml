name: Verify all i18n files are alphabetized

on:
  pull_request:
    paths:
      - strings/** # Should only check if any strings changed
      - .github/workflows/i18n-check.yml
  workflow_dispatch:

# A newer push to the same pull request cancels the superseded run
concurrency:
  group: i18n-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update_translations:
    runs-on: ubuntu-latest
    steps:
    # Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v5

    # Set up node to run the javascript
    - name: Set up node
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    # The only argument is the `directory`, which is where the i18n files are
    # stored.
    - name: Run Update JSON Files action
      uses: audiobookshelf/audiobookshelf-i18n-updater@v1.3.0
      with:
        directory: 'strings/'  # Adjust the directory path as needed
