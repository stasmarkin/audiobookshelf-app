# Inherited iOS simulator build. Audiobookshelf+ is an Android product and the iOS project is not maintained here, so this
# runs only on demand (workflow_dispatch). The shared web app is built and tested by "Build APK".
name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS simulator app
    runs-on: macos-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --omit=optional

      - name: Build shared web app
        run: npm run generate

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --deployment

      - name: Build iOS simulator app
        working-directory: ios/App
        run: |
          xcodebuild -quiet \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ASSETCATALOG_COMPILER_APPICON_NAME=IconsDebug \
            CODE_SIGNING_ALLOWED=NO \
            build

          echo "iOS simulator build succeeded."

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v6
        with:
          name: audiobookshelf-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/Audiobookshelf.app
          if-no-files-found: error
          retention-days: 5
