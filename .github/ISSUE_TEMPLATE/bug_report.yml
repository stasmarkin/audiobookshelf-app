name: Bug report
description: Report a problem in the Audiobookshelf+ Android app.
title: '[Bug]: '
labels: ['bug', 'android', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Audiobookshelf+! Search existing Issues first.
        For questions, use [Discussions](https://github.com/ADD-OCD/audiobookshelfplus-app/discussions).
        Server-only problems belong in the [upstream server project](https://github.com/advplyr/audiobookshelf).

        **Security vulnerabilities:** use [private reporting](https://github.com/ADD-OCD/audiobookshelfplus-app/security/advisories/new), not a public Issue.
        **Before sharing logs or screenshots, remove tokens, passwords, private server URLs, and personal information.** Check exported diagnostics yourself even if they appear sanitized.
  - type: input
    id: app-version
    attributes:
      label: Installed Audiobookshelf+ version
      description: Include the Audiobookshelf+ version and build number if available, not just the upstream version. If unavailable, say so.
      placeholder: e.g. Audiobookshelf+ 0.18.2, versionCode 136
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 16 / One UI 8, or custom ROM
  - type: input
    id: device-model
    attributes:
      label: Device model
      placeholder: e.g. Samsung Galaxy S22 Ultra or Pixel 9
  - type: dropdown
    id: media-source
    attributes:
      label: Downloaded or streamed media?
      options:
        - Downloaded media / offline playback
        - Streamed media
        - Both downloaded and streamed media
        - Not related to media playback
        - Not sure
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include error text with private information removed.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Number the steps. If intermittent, describe what you know and how often it happens.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (optional)
      description: Paste a minimal sanitized excerpt or attach a redacted screenshot. Never include tokens, passwords, private server URLs, or personal information.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Installation source, server version, audiobook or podcast, workarounds, and whether this worked in an earlier version.