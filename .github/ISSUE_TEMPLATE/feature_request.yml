name: Feature request
description: Suggest an improvement to the Audiobookshelf+ Android app.
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Search Issues and Discussions for similar requests first. Audiobookshelf+ currently ships Android only.
        Keep examples free of personal information, tokens, passwords, and private server URLs.
        Report vulnerabilities through [private reporting](https://github.com/ADD-OCD/audiobookshelfplus-app/security/advisories/new).
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task you are trying to accomplish, who it affects, and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: Explain how the app should work and how that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
      description: What other approaches have you considered or tried?
  - type: textarea
    id: context
    attributes:
      label: Examples, screenshots, or context (optional)
      description: Include the app version or affected screen if helpful. Mockups are welcome but not required.